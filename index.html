<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Calendari d'Advent: Desembre 🌟</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌟%3C/text%3E%3C/svg%3E">
    <style>
        /* ==================================== */
        /* === 1. Estils Generals i Paleta === */
        /* ==================================== */

        :root {
            /* Paleta de colors nadalenca i elegant */
            --color-rojo-base: #B71C1C; /* Vermell Bordeus */
            --color-rojo-claro: #E57373;
            --color-dorado-base: #FFD700; /* Or Pur */
            --color-dorado-brillo: #FFFACD; /* Daurat Clar */
            --color-fondo: #F5F5F5; /* Fons suau */
            --color-texto-principal: #333333;
            --sombra-suave: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif; /* Font clàssica i elegant */
            background-color: var(--color-fondo);
            color: var(--color-texto-principal);
            line-height: 1.6;
            padding: 20px;
            background-image: linear-gradient(135deg, var(--color-fondo) 0%, #ffffff 50%, var(--color-fondo) 100%);
        }

        /* =================================== */
        /* === 2. Estils de la Capçalera === */
        /* =================================== */

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(to right, var(--color-rojo-base), #D32F2F);
            color: var(--color-dorado-brillo);
            border-radius: 15px;
            box-shadow: var(--sombra-suave);
            border: 2px solid var(--color-dorado-base);
        }

        .header h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-style: italic;
            margin-top: 5px;
            font-size: 1.1em;
        }

        /* Estils del Panell de Test */
        .test-panel {
            max-width: 1200px;
            margin: 0 auto 20px;
            padding: 15px;
            background-color: #ffe082; /* Groc suau de test */
            border-radius: 8px;
            border: 1px solid var(--color-dorado-base);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .test-panel label {
            font-weight: bold;
            color: var(--color-rojo-base);
        }

        .test-panel input[type="number"] {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid var(--color-rojo-base);
            width: 80px;
            text-align: center;
        }

        /* ========================================= */
        /* === 3. Estils de la Quadrícula (Dies) === */
        /* ========================================= */

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 120px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: var(--sombra-suave);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .day-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .day-label {
            font-size: 0.8em;
            text-transform: uppercase;
        }

        /* Días Desbloqueados (Passats i Actual) */
        .day.unlocked {
            background: linear-gradient(145deg, var(--color-rojo-base), var(--color-rojo-claro));
            color: var(--color-dorado-brillo);
            border: 3px solid var(--color-dorado-base);
            box-shadow: 0 0 10px var(--color-dorado-base), 0 0 20px var(--color-rojo-claro);
            cursor: pointer; /* Assegura el cursor de clic */
        }

        .day.unlocked:hover {
            transform: scale(1.05) rotate(-1deg);
            background: linear-gradient(145deg, #CC0000, #F44336);
            box-shadow: 0 0 15px var(--color-dorado-base), 0 0 30px var(--color-dorado-base);
        }

        /* Dia Actual - Ressenyat Especial */
        .day.today {
            background: var(--color-dorado-base);
            color: var(--color-rojo-base);
            border: 4px solid var(--color-rojo-base);
            animation: pulse-gold 2s infinite alternate;
        }

        .day.today:hover {
            transform: scale(1.08) rotate(1deg);
        }

        /* Días Bloqueados (Futurs) */
        .day.locked {
            background-color: #AAAAAA;
            color: #E0E0E0;
            cursor: not-allowed;
            opacity: 0.6;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }

        .day.locked::before {
            content: '🔒'; /* Icona de cadenat */
            font-size: 3em;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #424242;
            z-index: 2;
        }
        
        .day.locked .day-number, .day.locked .day-label {
            visibility: hidden;
        }

        /* Animació subtil de brillantor daurat */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 8px var(--color-dorado-base), 0 0 12px rgba(255, 215, 0, 0.5); }
            100% { box-shadow: 0 0 12px var(--color-dorado-base), 0 0 20px var(--color-dorado-base); }
        }

        /* =================================== */
        /* === 4. Estils del Modal (Pop-up) === */
        /* =================================== */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #ffffff;
            color: var(--color-texto-principal);
            padding: 20px;
            border-radius: 15px;
            max-width: 95vw;      /* límite horizontal */
            max-height: 95vh;     /* límite vertical */
            width: auto;          /* que se adapte al contenido */
            overflow: auto;       /* scroll si se pasa del alto */
            position: relative;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.3s ease-out;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 5px solid var(--color-rojo-base);
            display: inline-block; /* que “abrace” el contenido */
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--color-rojo-base);
            padding-bottom: 10px;
        }

        .modal-header h2 {
            color: var(--color-rojo-base);
            font-size: 1.8em;
        }

        .close-button {
            background: var(--color-dorado-base);
            color: var(--color-rojo-base);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1.2em;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        .close-button:hover {
            background: var(--color-rojo-claro);
            color: var(--color-dorado-brillo);
        }

        .modal-image {
            display: block;
            max-width: 100%;   /* no superar el ancho del modal */
            max-height: 70vh;  /* no superar el alto de la pantalla */
            width: auto;       /* respetar proporciones */
            height: auto;      /* respetar proporciones */
            border-radius: 10px;
            margin: 0 auto 15px;
            border: 3px solid var(--color-dorado-base);
            object-fit: contain; /* encajar la imagen dentro sin recortar */
        }


        .modal-message {
            font-size: 1.2em;
            font-style: italic;
            text-align: center;
            padding: 10px;
            background-color: var(--color-dorado-brillo);
            border-radius: 8px;
            color: var(--color-rojo-base);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        /* ============================== */
        /* === 5. Media Queries (RWD) === */
        /* ============================== */

        @media (min-width: 768px) {
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
                gap: 20px;
            }

            .day {
                height: 150px;
            }

            .header h1 {
                font-size: 3.5em;
            }

            .modal-content {
                max-width: 600px;
            }
        }

        @media (max-width: 500px) {
            .calendar-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }

        @keyframes celebration-shake {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.02) rotate(0.5deg); }
            50% { transform: scale(1.04) rotate(-0.5deg); }
            75% { transform: scale(1.02) rotate(0.5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        
        .modal-content.celebrating {
            animation: celebration-shake 0.6s ease-in-out infinite;
        }

    </style>
</head>

        /* ================================== */
        /* === LÒGICA DEL CALENDARI (JS) === */
        /* ================================== */

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            
            // Afegir l'escoltador d'esdeveniments per a l'entrada de test
            document.getElementById('testDay').addEventListener('input', renderCalendar);
        });

        const calendarGrid = document.getElementById('calendarGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalButton = document.getElementById('closeModalButton');
        const modalTitle = document.getElementById('modalTitle');
        const modalImage = document.getElementById('modalImage');
        const modalMessage = document.getElementById('modalMessage');

        /**
         * Obté el dia actual, amb la possibilitat de sobrescriure'l amb el panell de test.
         */
        function getCurrentDay() {
            // **INICI DE LA FUNCIÓ DE TEST**
            // Llegeix el valor del camp de test
            const testDayInput = document.getElementById('testDay');
            
            // Si el camp de test existeix i té un valor vàlid, utilitza aquest valor
            if (testDayInput && testDayInput.value >= 1 && testDayInput.value <= 31) {
                return parseInt(testDayInput.value);
            }
            // **FINAL DE LA FUNCIÓ DE TEST (Aquesta part s'ha d'eliminar/comentar per al llançament final)**
            
            // Utilitza la data real del sistema (sense el panell de test)
            const now = new Date();
            const currentMonth = now.getMonth(); 
            
            // Només funcionarà correctament si és desembre (mes 11)
            if (currentMonth === 11) {
                return now.getDate();
            }
            // Si no és desembre, retornem 0 per bloquejar-ho tot (excepte si fem test)
            return 0; 
        }

        /**
         * Genera i renderitza els 31 dies del calendari.
         * Aquesta funció es crida en carregar i al canviar el dia de test.
         */
        function renderCalendar() {
            // Netejar la quadrícula abans de tornar a renderitzar (necessari per a la funció de test)
            calendarGrid.innerHTML = ''; 

            const currentDay = getCurrentDay();
            const isDecember = currentDay > 0; // Si currentDay és > 0, estem a desembre o simulant desembre

            // El calendari va de l'1 al 31
            for (let day = 1; day <= 31; day++) {
                const dayElement = document.createElement('div');
                dayElement.classList.add('day');
                dayElement.dataset.day = day;

                /*
                let isLocked = true;
                
                // Lògica de desbloqueig: desbloquejat si el dia és menor o igual al dia actual (real o de test)
                if (day <= currentDay) {
                    isLocked = false;
                    dayElement.classList.add('unlocked');
                    
                    if (day === currentDay) {
                         dayElement.classList.add('today'); // Dia actual ressaltat
                    }
                } else {
                    dayElement.classList.add('locked'); // Dia futur bloquejat
                }

                */

                let isLocked = false;

                dayElement.classList.add('unlocked');
                
                // Assignar el gestor d'esdeveniments només als dies desbloquejats
                if (!isLocked) {
                     dayElement.addEventListener('click', () => openDayContent(day));
                }


                dayElement.innerHTML = `
                    <span class="day-number">${day}</span>
                    <span class="day-label">Desembre</span>
                `;

                calendarGrid.appendChild(dayElement);
            }
        }

        /**
         * Mostra el modal amb la foto i frase del dia seleccionat.
         * @param {number} day - El número del dia (1 a 31).
         */
        function openDayContent(day) {
            const contentIndex = day - 1; 

            modalTitle.textContent = `Dia ${day}`;
            modalMessage.textContent = FRASES_DIARIES[contentIndex];

            if (day === 16) {
                modalOverlay.querySelector('.modal-content')
                    .classList.add('celebrating');
            
                lanzarCelebracion();
            
                setTimeout(() => {
                    modalOverlay.querySelector('.modal-content')
                        .classList.remove('celebrating');
                }, 12000);
            }

            if (day === 25) {
                modalOverlay.querySelector('.modal-content').classList.add('celebrating');
                lanzarNavidad();
                setTimeout(() => {
                    modalOverlay.querySelector('.modal-content').classList.remove('celebrating');
                }, 12000);
            }

            if (day === 31) {
                modalOverlay.querySelector('.modal-content').classList.add('celebrating');
                lanzarAnyNou();
                setTimeout(() => {
                    modalOverlay.querySelector('.modal-content').classList.remove('celebrating');
                }, 12000);
            }



            // Todas las combinaciones posibles
            const candidates = [
                `images/IMG-${day}.jpg`,
                `images/IMG_${day}.jpg`,
                `images/IMG-${day}.webp`,
                `images/IMG_${day}.webp`
            ];

            let index = 0;

            // Función recursiva para ir probando una a una
            function tryNext() {
                if (index >= candidates.length) {
                    modalImage.src = ""; 
                    console.warn("⚠ No s'ha trobat cap imatge per al dia", day);
                    return;
                }

                const src = candidates[index];
                index++;

                // Intentar cargar la imagen
                modalImage.onerror = tryNext;
                modalImage.src = src;
            }

            tryNext(); // iniciar comprobación

            modalOverlay.style.display = 'flex';
            setTimeout(() => {
                modalOverlay.classList.add('active');
            }, 10);
        }



        /**
         * Retorna la ruta correcta de la imatge del dia:
         * IMG-X.jpg si existeix, sinó IMG-X.webp
         */
        async function getImageForDay(day) {
            const jpg = `images/IMG-${day}.jpg`;
            const webp = `images/IMG-${day}.webp`;

            try {
                const res = await fetch(jpg, { method: 'HEAD' });
                if (res.ok) return jpg;
                return webp;
            } catch {
                return webp;
            }
        }



        /**
         * Tanca el modal.
         */
        function closeDayContent() {
            modalOverlay.classList.remove('active');
            setTimeout(() => {
                modalOverlay.style.display = 'none';
            }, 300);
        }

        function lanzarCelebracion() {
            const duration = 20000; // 20 segundos
            const end = Date.now() + duration;
        
            const colors = [
                '#FFD700', // dorado
                '#B71C1C', // rojo oscuro
                '#E57373', // rojo claro
                '#FFFFFF', // blanco
                '#FF4081'  // rosa
            ];
        
            const scalarBig = 1.6; // tamaño grande de partículas
        
            /* ========================= */
            /* === MEGA EXPLOSIÓN === */
            /* ========================= */
            confetti({
                particleCount: 500,
                spread: 360,
                startVelocity: 65,
                gravity: 0.8,
                scalar: scalarBig,
                colors,
                origin: { x: 0.5, y: 0.6 }
            });
        
            /* ========================= */
            /* === LLUVIA CONSTANTE === */
            /* ========================= */
            (function rain() {
                confetti({
                    particleCount: 35,
                    angle: 90,
                    spread: 140,
                    startVelocity: 30,
                    gravity: 1.3,
                    ticks: 180,
                    scalar: scalarBig,
                    colors,
                    origin: { x: Math.random(), y: -0.25 }
                });
        
                if (Date.now() < end) {
                    requestAnimationFrame(rain);
                }
            })();
        
            /* ================================ */
            /* === CAÑONES LATERALES DOBLES === */
            /* ================================ */
            const sideCannons = setInterval(() => {
                confetti({
                    particleCount: 150,
                    angle: 55,
                    spread: 70,
                    startVelocity: 55,
                    gravity: 1,
                    scalar: scalarBig,
                    colors,
                    origin: { x: 0 }
                });
        
                confetti({
                    particleCount: 150,
                    angle: 125,
                    spread: 70,
                    startVelocity: 55,
                    gravity: 1,
                    scalar: scalarBig,
                    colors,
                    origin: { x: 1 }
                });
            }, 900);
        
            /* ================================= */
            /* === EXPLOSIONES ALEATORIAS === */
            /* ================================= */
            const randomBursts = setInterval(() => {
                confetti({
                    particleCount: 200,
                    spread: 360,
                    startVelocity: 50,
                    gravity: 0.9,
                    scalar: scalarBig,
                    colors,
                    origin: {
                        x: Math.random(),
                        y: Math.random() * 0.6
                    }
                });
            }, 2000);
        
            /* === STOP === */
            setTimeout(() => {
                clearInterval(sideCannons);
                clearInterval(randomBursts);
            }, duration);
        }


        function lanzarNavidad() {
            const duration = 30000; // 30 segundos
            const end = Date.now() + duration;
        
            const snowColors = ['#FFFFFF', '#F5F5F5', '#E0E0E0'];
            const starColors = ['#FFD700', '#FFFACD', '#FFECB3'];
        
            const snowSize = 2.6;
            const starSize = 2.4;
        
            let wind = 0;
        
            /* =============================== */
            /* ❄️ NIEVE PRINCIPAL CON VIENTO */
            /* =============================== */
            (function snowStorm() {
                confetti({
                    particleCount: 12,
                    startVelocity: 0,
                    gravity: 0.18,
                    ticks: 400,
                    scalar: snowSize,
                    colors: snowColors,
                    shapes: ['circle'],
                    drift: wind,
                    origin: {
                        x: Math.random(),
                        y: -0.25
                    }
                });
        
                if (Date.now() < end) {
                    requestAnimationFrame(snowStorm);
                }
            })();
        
            /* 🌬️ OSCILACIÓN DEL VIENTO */
            const windInterval = setInterval(() => {
                wind = Math.sin(Date.now() / 1800) * 0.6;
            }, 300);
        
            /* =============================== */
            /* ⭐ LLUVIA DE ESTRELLAS */
            /* =============================== */
            const starRain = setInterval(() => {
                confetti({
                    particleCount: 80,
                    spread: 140,
                    startVelocity: 20,
                    gravity: 0.7,
                    ticks: 220,
                    scalar: starSize,
                    colors: starColors,
                    shapes: ['star'],
                    origin: {
                        x: Math.random(),
                        y: -0.2
                    }
                });
            }, 900);
        
            /* =============================== */
            /* ⭐ EXPLOSIONES DORADAS */
            /* =============================== */
            const goldenBursts = setInterval(() => {
                confetti({
                    particleCount: 200,
                    spread: 360,
                    startVelocity: 35,
                    gravity: 0.9,
                    scalar: starSize,
                    colors: starColors,
                    shapes: ['star'],
                    origin: {
                        x: Math.random(),
                        y: Math.random() * 0.35
                    }
                });
            }, 2500);
        
            /* ✨ DESTELLOS MÁGICOS */
            const sparkles = setInterval(() => {
                confetti({
                    particleCount: 30,
                    spread: 360,
                    startVelocity: 8,
                    gravity: 0.2,
                    ticks: 120,
                    scalar: 0.8,
                    colors: ['#FFFACD', '#FFD700'],
                    shapes: ['circle'],
                    origin: {
                        x: Math.random(),
                        y: Math.random()
                    }
                });
            }, 1300);
        
            /* ❄️ COPOS GIGANTES OCASIONALES */
            const giantSnowflakes = setInterval(() => {
                confetti({
                    particleCount: 3,
                    startVelocity: 0,
                    gravity: 0.15,
                    ticks: 500,
                    scalar: 3.5,
                    colors: ['#FFFFFF'],
                    shapes: ['circle'],
                    origin: {
                        x: Math.random(),
                        y: -0.3
                    }
                });
            }, 4000);
        
            /* 🛑 STOP */
            setTimeout(() => {
                clearInterval(windInterval);
                clearInterval(starRain);
                clearInterval(goldenBursts);
                clearInterval(sparkles);
                clearInterval(giantSnowflakes);
            }, duration);
        }



        function lanzarAnyNou() {
            const duration = 26000; // más duración
            const end = Date.now() + duration;
        
            const colors = [
                '#FFD700', // dorado
                '#FF4081', // rosa
                '#FFFFFF', // blanco
                '#00E5FF', // azul
                '#B71C1C'  // rojo
            ];
        
            const big = 2.4;
        
            /* =============================== */
            /* 🎆 FUEGOS ARTIFICIALES CENTRALES */
            /* =============================== */
            function megaFirework() {
                confetti({
                    particleCount: 320,
                    spread: 360,
                    startVelocity: 75,
                    gravity: 0.9,
                    scalar: big,
                    colors,
                    origin: {
                        x: Math.random(),

                    }

            megaFirework();
            const fireworks = setInterval(megaFirework, 1000);
        
            /* =============================== */
            /* 🎊 CAÑONES LATERALES DOBLES */

            const cannons = setInterval(() => {
                confetti({
                    particleCount: 220,
                    angle: 55,
                    spread: 85,
                    startVelocity: 60,
                    gravity: 1,
                    scalar: big,
                    colors,
                    origin: { x: 0 }
                });
        
                confetti({
                    particleCount: 220,
                    angle: 125,
                    spread: 85,
                    startVelocity: 60,
                    gravity: 1,
                    scalar: big,
                    colors,
                    origin: { x: 1 }
                });
            }, 1400);
        
            /* =============================== */
            /* ❤️⭐ CORAZONES Y ESTRELLAS */
            /* =============================== */
            const extras = setInterval(() => {
                confetti({
                    particleCount: 140,
                    spread: 360,
                    startVelocity: 40,
                    gravity: 0.8,
                    scalar: big,
                    shapes: ['heart', 'star'],
                    colors,
                    origin: {
                        x: Math.random(),
                        y: Math.random() * 0.4
                    }
                });
            }, 1800);
        
            /* =============================== */
            /* ✨ DESTELLOS RÁPIDOS */
            /* =============================== */
            const sparkles = setInterval(() => {
                confetti({
                    particleCount: 40,
                    spread: 360,
                    startVelocity: 10,
                    gravity: 0.3,
                    ticks: 100,
                    scalar: 0.9,
                    colors: ['#FFFFFF', '#FFD700'],
                    shapes: ['circle'],
                    origin: {
                        x: Math.random(),
                        y: Math.random()
                    }
                });
            }, 1200);
        
            /* =============================== */
            /* 🎇 COHETES ASCENDENTES */
            /* =============================== */
            const rockets = setInterval(() => {
                confetti({
                    particleCount: 120,
                    angle: 90,
                    spread: 25,
                    startVelocity: 70,
                    gravity: 1.1,
                    scalar: big,
                    colors,
                    origin: {
                        x: Math.random(),
                        y: 1
                    }
                });
            }, 2200);
        
            /* 🛑 STOP */
            setTimeout(() => {
                clearInterval(fireworks);
                clearInterval(cannons);
                clearInterval(extras);
                clearInterval(sparkles);
                clearInterval(rockets);
            }, duration);
        }



        // Assignar esdeveniments per tancar el modal
        closeModalButton.addEventListener('click', closeDayContent);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeDayContent();

    </script>
